name: CI
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build
